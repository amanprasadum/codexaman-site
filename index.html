<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeXaman Has Moved</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Auto Redirect -->
    <meta http-equiv="refresh" content="5;url=https://codexaman.in/">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .move-card {
            max-width: 600px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .old-domain {
            color: #6c757d;
            text-decoration: line-through;
        }

        .new-domain {
            color: #0d6efd;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container px-3">
        <div class="move-card mx-auto">

            <div class="logo">
                Code<span class="text-primary">Xaman</span>
            </div>

            <h1 class="h3 fw-bold mb-3">
                We've Moved!
            </h1>

            <p class="text-muted mb-4">
                <span class="old-domain">codexaman.space</span>
                is now
                <span class="new-domain">codexaman.in</span>
            </p>

            <p class="text-muted mb-4">
                You will be automatically redirected to our new website
                in <strong id="countdown">5</strong> seconds.
            </p>

            <a href="https://codexaman.in/" class="btn btn-primary px-4">
                Visit New Website
            </a>

        </div>
    </div>

    <script>
        let seconds = 5;

        const countdown = document.getElementById("countdown");

        const timer = setInterval(() => {
            seconds--;
            countdown.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "https://codexaman.in/";
            }
        }, 1000);
    </script>

</body>
</html>
